name: Build and Release

on:
  push:
    tags:
      - "v*" # Runs on version tags like v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build

      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.set-artifact-path.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set artifact path
        id: set-artifact-path
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Windows") {
              echo "path=release/**/*.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          elseif ($env:RUNNER_OS -eq "macOS") {
              echo "path=release/**/*.dmg" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          elseif ($env:RUNNER_OS -eq "Linux") {
              echo "path=release/**/*.AppImage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
